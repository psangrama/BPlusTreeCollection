# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: "main"
  pull_request:
    branches: "main"

jobs:
  build:
    env:
      build_config: 'Release'
      woring_directory: ./src
      solution: 'BPlusTreeCollection.sln'
    
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ${{ env.woring_directory }}
        
    steps:
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1.0.5
      
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 6.0.x
    
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration ${{env.build_config}} -p:Version=$BUILD_VERSION --no-restore
    - name: Execute Test
      run: dotnet test --configuration ${{env.build_config}} --no-build --verbosity normal
    
    - name: Get Build Version
      run: |
        Import-Module .\build\GetBuildVersion.psm1
        Write-Host $Env:GITHUB_REF
        $version = GetBuildVersion -VersionString $Env:GITHUB_REF
        echo "BUILD_VERSION=$version" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf-8 -Append
      shell: pwsh
    
