name: Release

on:
  push:
    # Tag the commit you want to ship, e.g. v1.0.0 or v1.0.0-preview.1
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.0.0 or 1.0.0-preview.1'
        required: true
        type: string
      dry_run:
        description: 'Build and pack, but do not push to NuGet'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  BUILD_CONFIG: Release
  WORKING_DIRECTORY: ./src
  DOTNET_NOLOGO: true

jobs:
  publish:
    name: Pack and publish to NuGet
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read
      # Required for NuGet Trusted Publishing: lets the job mint a GitHub OIDC
      # token, which nuget.org exchanges for a short-lived API key.
      id-token: write

    # Must match the Environment registered on the nuget.org trusted publishing
    # policy. It also gates the run on manual approval: a push to nuget.org
    # cannot be undone, only delisted.
    environment: nuget

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            # refs/tags/v1.2.3 -> 1.2.3
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          # NuGet accepts 1.2.3 and 1.2.3-preview.1, nothing else.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid SemVer version (expected 1.2.3 or 1.2.3-preview.1)."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: >
          dotnet build
          --configuration ${{ env.BUILD_CONFIG }}
          --no-restore
          -p:Version=${{ steps.version.outputs.version }}

      - name: Test (full suite)
        # Nothing ships without the long-running tests passing.
        run: dotnet test --configuration ${{ env.BUILD_CONFIG }} --no-build

      - name: Pack
        run: >
          dotnet pack SP.BPlusTreeCollection/SP.BPlusTreeCollection.csproj
          --configuration ${{ env.BUILD_CONFIG }}
          --no-build
          -p:Version=${{ steps.version.outputs.version }}
          --output ${{ github.workspace }}/artifacts

      - name: Upload package as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          # Both the .nupkg and its .snupkg symbol package.
          path: ${{ github.workspace }}/artifacts/*

      # Exchanges this job's GitHub OIDC token for a short-lived nuget.org API key.
      # Nothing long-lived is stored: there is no NUGET_API_KEY secret.
      # NUGET_USER is a repository *variable* (Settings > Secrets and variables >
      # Actions > Variables), holding your nuget.org username. It is not a secret.
      - name: Log in to NuGet (Trusted Publishing)
        id: nuget-login
        if: github.event_name == 'push' || inputs.dry_run == false
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        if: github.event_name == 'push' || inputs.dry_run == false
        # Pushing the .nupkg also pushes the matching .snupkg from the same folder.
        run: >
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
